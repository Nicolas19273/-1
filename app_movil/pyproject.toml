# Join In: app de Android hecha en Python con Flet.
# El APK se arma solo en GitHub Actions (.github/workflows/app.yml).
# Para probarla en tu computador:  cd app_movil && flet run src/main.py

[project]
name = "join-in"
version = "1.0.0"
description = "Join In: crea avisos y únete a eventos con estudiantes de la Universidad de Los Lagos, en Osorno."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "flet>=1.1,<2",
  "certifi",   # certificados para conectarse por HTTPS al servidor desde Android
  "tzdata",    # zona horaria de Chile en el celular
]

[tool.flet]
product = "Join In"
org = "com.joinin"
bundle_id = "com.joinin.app"  # no cambiarlo: Android lo usa para reconocer las actualizaciones
company = "Join In"
copyright = "Proyecto Join In"
icon_background = "#FFD21F"   # fondo amarillo detrás del «+1» del ícono (assets/icon.png)

[tool.flet.splash]
color = "#FFD21F"
dark_color = "#FFD21F"

[tool.flet.app]
path = "src"

[tool.flet.android]
split_per_abi = true  # un APK por tipo de procesador: cada uno pesa un tercio
