# Blueprint de Render: con este archivo Render sabe cómo publicar el servidor de la app.
# Plan gratuito. La base de datos va aparte (Neon), en DATABASE_URL.
services:
  - type: web
    name: falta-uno
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: DATABASE_URL
        sync: false # Render te la pide al crear la página (no queda en GitHub)
      - key: BREVO_API_KEY
        sync: false # clave de Brevo para enviar los códigos (README, paso 5)
      - key: CORREO_REMITENTE
        sync: false # correo verificado en Brevo
